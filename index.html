<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polinusa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<canvas id="map" role="application" aria-label="Seekarte. Ziehen schiebt die Karte. Zwei Finger, Mausrad, Plus und Minus zoomen." tabindex="0"></canvas>

<header id="top" class="band">
<div class="top-inner">
<div class="top-row">
<div class="isle"><button id="isleName" class="isle-name" type="button" aria-label="Insel umbenennen">Panua</button><span id="isleType" class="cap">Hohe Insel</span></div>
<span class="top-right"><button id="manaBtn" class="mana" type="button" hidden aria-label="Ansehen"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#ic-mana"/></svg><b id="manaNum">0</b></button><button id="idleBtn" class="pop idle" type="button" aria-label="Ohne Arbeit"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#ic-idle"/></svg><b id="idleNum">0</b></button><button id="popBtn" class="pop" type="button" aria-label="Bewohner und Bedarf"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#ic-pop"/></svg><b id="popNum">0</b><span id="popCap">/0</span><i id="popDot" class="dot" aria-hidden="true"></i></button></span>
</div>
<button id="storeBtn" class="storebtn" type="button" aria-label="Lager"><span id="goods" class="goods"></span></button>
<button id="vitalBtn" class="vital" type="button" aria-label="Übersicht: Arbeit, Essen und Zuzug"></button>
</div>
<div class="manulua"></div>
</header>

<div id="compass" role="img" aria-label="Wind aus Nord">
<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26.5" fill="#EEE3C8" stroke="#2B1D14" stroke-width="1.3"/><circle cx="28" cy="28" r="22.6" fill="none" stroke="#3E2416" stroke-width="2.6" stroke-dasharray=".1 2.7" stroke-linecap="round"/><circle cx="28" cy="28" r="18.4" fill="none" stroke="#A84A2C" stroke-width="1.1"/><path d="M28 3L29.8 7.2H26.2Z" fill="#2B1D14"/><circle cx="28" cy="28" r="5.4" fill="none" stroke="#2B1D14" stroke-width="1.3"/><path d="M28 22.6V33.4M22.6 28H33.4" stroke="#2B1D14" stroke-width="1.3"/><path d="M28 11.5V36" stroke="#A84A2C" stroke-width="2.4" stroke-linecap="round"/><path d="M28 44.5L22.6 35.8H33.4Z" fill="#A84A2C" stroke="#2B1D14" stroke-width=".7" stroke-linejoin="round"/></svg>
<span>Wind</span>
</div>

<button id="seasonBtn" class="season" type="button" aria-label="Kalender"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use id="seasonUse" href="#ic-passat"/></svg><b id="seasonTxt">6. Mond</b></button>

<div id="sidectl">
<button id="newsBtn" class="round" type="button" aria-label="Nachrichten" aria-expanded="false" aria-controls="newsList"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3.4 14.6Q4.6 9 10.8 7.6L17.6 6Q20.4 5.4 22 7.2Q23.6 9.2 22 11.6Q19.8 15.6 15.4 18.6Q10.8 21.6 6.8 20.4Q2.8 19.2 3.4 14.6Z" fill="#F3D9A0" stroke="#2B1D14" stroke-width="1.25" stroke-linejoin="round"/><path d="M8.6 8.4L10 5.8L11.8 7.6L13.4 5.2L15.2 6.9L17 4.8L18.4 6.2" fill="none" stroke="#2B1D14" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><path d="M6.6 18.6Q8.8 13.8 15.2 12Q18 11.3 19.8 11.8Q17.8 15.6 13.2 18Q9.6 19.8 6.6 18.6Z" fill="#D98A5E" stroke="#2B1D14" stroke-width=".9" stroke-linejoin="round"/><path d="M22 7.4L24.6 5.2" stroke="#2B1D14" stroke-width="1.9" stroke-linecap="round"/></svg><b id="newsNum" class="badge" hidden></b></button>
<button id="speedBtn" class="round speed" type="button" aria-pressed="false" aria-label="Doppelte Geschwindigkeit"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M4.6 7.2Q4.4 6 5.5 6.6L12.6 12.2Q13.4 13 12.6 13.8L5.6 19.4Q4.5 20 4.7 18.8Z" fill="#2B1D14"/><path d="M13.2 7.4Q13 6.2 14.1 6.8L21 12.3Q21.8 13 21 13.8L14.2 19.2Q13.1 19.8 13.3 18.6Z" fill="#2B1D14"/></svg></button>
<button id="menuBtn" class="round" type="button" aria-label="Menü"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="6" cy="13" r="2.4" fill="#2B1D14"/><circle cx="13" cy="13" r="2.4" fill="#A84A2C"/><circle cx="20" cy="13" r="2.4" fill="#2B1D14"/></svg></button>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="newsList" class="newslist" hidden></div>

<button id="quest" class="quest" type="button" hidden><span class="q-n cap"></span><b class="q-t"></b><span class="q-d"></span><span class="q-foot"><span class="q-bar"><i></i></span><span class="q-p"></span></span></button>

<nav id="bottom" class="band" aria-label="Bauen">
<div class="manulua"></div>
<div class="bottom-inner">
<div class="bottom-head"><span class="tabs"><button id="tabBau" class="tab" type="button" aria-pressed="true">Bauen</button><button id="tabDeco" class="tab" type="button" aria-pressed="false" hidden>Schmuck</button></span><span id="buildWhere" class="where">auf Panua</span></div>
<div class="bottom-row">
<div id="buildList" class="build-list" role="toolbar" aria-label="Was bauen"></div>
<svg class="hb" viewBox="0 0 10 50" aria-hidden="true"><path d="M5 2V48" stroke="#3E2416" stroke-width="1.2"/><path d="M1 5L5 8L9 5M1 11L5 14L9 11M1 17L5 20L9 17M1 23L5 26L9 23M1 29L5 32L9 29M1 35L5 38L9 35M1 41L5 44L9 41" fill="none" stroke="#3E2416" stroke-width="1.1" stroke-linejoin="round"/></svg>
<button id="tradeBtn" class="tbtn" type="button" aria-label="Flotte: alle Kanus und Handelsketten"><svg viewBox="0 0 44 22" aria-hidden="true"><path d="M3 11H41" stroke="#2B1D14" stroke-width="4.4" stroke-linecap="round"/><path d="M3 11H41" stroke="#B08048" stroke-width="2.8" stroke-linecap="round"/><path d="M3 11H41" stroke="#6E4A28" stroke-width="2.8" stroke-dasharray="1.1 2.2"/><g fill="#7A4E2E" stroke="#2B1D14" stroke-width=".9"><ellipse cx="13" cy="11" rx="4.2" ry="5.2"/><ellipse cx="22" cy="11" rx="4.2" ry="5.2"/><ellipse cx="31" cy="11" rx="4.2" ry="5.2"/></g></svg><span>Flotte</span></button>
</div>
</div>
</nav>

<div id="place" class="band" hidden>
<div class="manulua"></div>
<div class="place-inner">
<svg id="placeIc" class="place-ic" viewBox="-17 -29 34 33" aria-hidden="true"></svg>
<div class="place-txt"><b id="placeName">Haus</b><span id="placeInfo"></span><span id="placeMsg" class="msg" role="status"></span></div>
<button id="placeDone" class="btn" type="button">Fertig</button>
<button id="placeOk" class="btn primary" type="button">Bauen</button>
</div>
</div>

<section id="sheet" class="band sheet" hidden aria-label="Details">
<div class="manulua"></div>
<div id="sheetBody" class="sheet-body"></div>
</section>
</div>

<script src="src/util.js"></script>
<script src="src/data.js"></script>
<script src="src/art.js"></script>
<script src="src/world.js"></script>
<script src="src/state.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/quests.js"></script>
<script src="src/fleet.js"></script>
<script src="src/calendar.js"></script>
<script src="src/fleetui.js"></script>
<script src="src/audio.js"></script>
<script src="src/events.js"></script>
<script src="src/game.js"></script>
</body>
</html>
